networks:
  elri_network:
    driver: bridge

volumes:
  ollama_models:
  tei_embed_models:
  tei_rerank_models:
  postgres_data:
  redis_data:
  minio_data:
  langfuse_data:

services:
  ollama:
    image: ollama/ollama:latest
    container_name: elri_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - NVIDIA_VISIBLE_DEVICES=all
    runtime: nvidia
    networks:
      - elri_network

  tei-embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.5
    container_name: elri_tei_embeddings
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - tei_embed_models:/data
    command: --model-id nomic-ai/nomic-embed-text-v1.5 --port 8080 --max-batch-tokens 16384
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - elri_network

  tei-reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.5
    container_name: elri_tei_reranker
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - tei_rerank_models:/data
    command: --model-id cross-encoder/ms-marco-MiniLM-L-6-v2 --port 8081 --dtype float32
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - elri_network

  postgres:
    image: postgres:16-alpine
    container_name: elri_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_DB=eswatini_legal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eswatini_legal"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - elri_network

  redis:
    image: redis:7-alpine
    container_name: elri_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - elri_network

  minio:
    image: minio/minio:latest
    container_name: elri_minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minio_admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-changeme}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 5
    networks:
      - elri_network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: elri_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-changeme}@postgres:5432/eswatini_legal
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minio_admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-changeme}
      - MINIO_BUCKET=legal-documents
      - JWT_SECRET=${JWT_SECRET:-changeme_secret_key_32_chars}
      - JWT_EXPIRE_MINUTES=${JWT_EXPIRE_MINUTES:-1440}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_PRIMARY_MODEL=${OLLAMA_PRIMARY_MODEL:-mistral:7b-instruct-q4_K_M}
      - OLLAMA_FALLBACK_MODEL=${OLLAMA_FALLBACK_MODEL:-mistral:7b-instruct-q4_K_M}
      - OLLAMA_ROUTER_MODEL=${OLLAMA_ROUTER_MODEL:-phi3:mini}
      - OLLAMA_TEMPERATURE=${OLLAMA_TEMPERATURE:-0.1}
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX:-8192}
      - OLLAMA_REQUEST_TIMEOUT=${OLLAMA_REQUEST_TIMEOUT:-300}
      - TEI_EMBEDDINGS_URL=http://tei-embeddings:8080
      - TEI_RERANKER_URL=http://tei-reranker:8081
      - TEI_EMBEDDING_DIMENSIONS=${TEI_EMBEDDING_DIMENSIONS:-768}
      - TEI_BATCH_SIZE=${TEI_BATCH_SIZE:-32}
      - RETRIEVAL_TOP_K=${RETRIEVAL_TOP_K:-8}
      - RETRIEVAL_RRF_K=${RETRIEVAL_RRF_K:-60}
      - RETRIEVAL_MIN_VECTOR_SCORE=${RETRIEVAL_MIN_VECTOR_SCORE:-0.55}
      - RETRIEVAL_RERANKER_CANDIDATES=${RETRIEVAL_RERANKER_CANDIDATES:-30}
      - PUBLIC_ROLE_DAILY_LIMIT=${PUBLIC_ROLE_DAILY_LIMIT:-10}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-http://langfuse:3000}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-pk-lf-local-xxxx}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-sk-lf-local-xxxx}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
      minio:
        condition: service_healthy
    networks:
      - elri_network

  ingestion-worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: elri_ingestion_worker
    restart: unless-stopped
    command: celery -A app.worker worker --loglevel=info
    volumes:
      - ../backend:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-changeme}@postgres:5432/eswatini_legal
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minio_admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-changeme}
      - MINIO_BUCKET=legal-documents
      - TEI_EMBEDDINGS_URL=http://tei-embeddings:8080
      - TEI_EMBEDDING_DIMENSIONS=${TEI_EMBEDDING_DIMENSIONS:-768}
      - TEI_BATCH_SIZE=${TEI_BATCH_SIZE:-32}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - elri_network

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: elri_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXTAUTH_URL=http://localhost:3000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - elri_network

  langfuse:
    image: langfuse/langfuse:latest
    container_name: elri_langfuse
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - langfuse_data:/data
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-changeme}@postgres:5432/langfuse
      - NEXTAUTH_URL=http://localhost:3001
      - NEXTAUTH_SECRET=${LANGFUSE_NEXTAUTH_SECRET:-changeme_secret}
      - SALT=${LANGFUSE_SALT:-changeme_salt}
      - SECRET_KEY=${LANGFUSE_SECRET_KEY:-sk-lf-local-xxxx}
      - PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-pk-lf-local-xxxx}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - elri_network
